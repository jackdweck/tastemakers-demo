<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tastemakers</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #121212;
    --purple: #7B4FFF;
    --purple-dim: rgba(123, 79, 255, 0.15);
    --white: #ffffff;
    --white-60: rgba(255,255,255,0.6);
    --white-20: rgba(255,255,255,0.1);
  }

  html, body {
    width: 100%; height: 100%;
    background: var(--bg);
    font-family: 'Plus Jakarta Sans', sans-serif;
    color: var(--white);
    overflow: hidden;
    cursor: none;
  }

  /* Custom cursor */
  .cursor {
    position: fixed;
    width: 12px; height: 12px;
    background: var(--purple);
    border-radius: 50%;
    pointer-events: none;
    z-index: 9999;
    transform: translate(-50%, -50%);
    transition: transform 0.1s ease, width 0.2s ease, height 0.2s ease, opacity 0.2s ease;
  }

  /* Slides container */
  .slides {
    width: 100vw; height: 100vh;
    position: relative;
  }

  .slide {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.5s ease;
  }

  .slide.active {
    opacity: 1;
    pointer-events: all;
  }

  /* ── TITLE SLIDE ── */
  .slide-title {
    gap: 0;
  }

  .wordmark {
    font-size: clamp(48px, 8vw, 96px);
    font-weight: 800;
    letter-spacing: -0.03em;
    line-height: 1;
  }

  .wordmark span.party { color: var(--white); }
  .wordmark span.place { color: var(--purple); }

  .tagline {
    margin-top: 20px;
    font-size: clamp(14px, 1.8vw, 20px);
    font-weight: 500;
    color: var(--white-60);
    letter-spacing: 0.12em;
    text-transform: uppercase;
  }

  .title-pill {
    margin-top: 40px;
    padding: 10px 28px;
    border: 1px solid var(--white-20);
    border-radius: 100px;
    font-size: 13px;
    font-weight: 600;
    color: var(--white-60);
    letter-spacing: 0.08em;
    text-transform: uppercase;
  }

  /* ── VIDEO SLIDES ── */
  .slide-video {
    gap: 28px;
  }

  .slide-label {
    font-size: clamp(11px, 1.2vw, 13px);
    font-weight: 700;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--purple);
  }

  .slide-title-text {
    font-size: clamp(28px, 4vw, 52px);
    font-weight: 800;
    letter-spacing: -0.02em;
    text-align: center;
    line-height: 1.1;
  }

  .phone-frame {
    position: relative;
    width: min(280px, 30vw);
    aspect-ratio: 9/19.5;
    border-radius: 40px;
    overflow: hidden;
    background: #1a1a1a;
    border: 2px solid rgba(255,255,255,0.08);
    box-shadow:
      0 0 0 1px rgba(0,0,0,0.5),
      0 40px 80px rgba(0,0,0,0.6),
      0 0 60px rgba(123,79,255,0.12);
  }

  .phone-frame video {
    width: 100%; height: 100%;
    object-fit: cover;
    display: block;
  }

  .phone-frame .placeholder {
    width: 100%; height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 12px;
    background: #1e1e1e;
    color: var(--white-60);
    font-size: 13px;
    font-weight: 500;
    text-align: center;
    padding: 24px;
  }

  .phone-frame .placeholder .icon {
    font-size: 32px;
    opacity: 0.4;
  }

  /* Phone notch */
  .phone-frame::before {
    content: '';
    position: absolute;
    top: 10px;
    left: 50%;
    transform: translateX(-50%);
    width: 80px; height: 6px;
    background: rgba(0,0,0,0.5);
    border-radius: 3px;
    z-index: 10;
  }

  /* ── PROGRESS DOTS ── */
  .progress {
    position: fixed;
    bottom: 36px;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    gap: 8px;
    z-index: 100;
  }

  .dot {
    width: 6px; height: 6px;
    border-radius: 50%;
    background: var(--white-20);
    transition: background 0.3s ease, width 0.3s ease;
    border-radius: 3px;
  }

  .dot.active {
    background: var(--purple);
    width: 24px;
  }

  /* ── NAV HINT ── */
  .nav-hint {
    position: fixed;
    bottom: 70px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--white-20);
    transition: opacity 0.5s ease;
    white-space: nowrap;
  }

  .nav-hint.hidden { opacity: 0; }

  /* ── SLIDE NUMBER ── */
  .slide-counter {
    position: fixed;
    top: 32px;
    right: 40px;
    font-size: 12px;
    font-weight: 600;
    color: var(--white-20);
    letter-spacing: 0.06em;
    font-variant-numeric: tabular-nums;
  }

  /* glow behind phone */
  .phone-glow {
    position: absolute;
    width: 200px; height: 200px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(123,79,255,0.3) 0%, transparent 70%);
    pointer-events: none;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    z-index: -1;
    filter: blur(20px);
  }
</style>
</head>
<body>

<div class="cursor" id="cursor"></div>

<div class="slides" id="slides">

  <!-- SLIDE 0: Title -->
  <div class="slide slide-title active" data-index="0">
    <img src="https://party-place-public-assets.s3.us-east-1.amazonaws.com/logos/PP-Logo3.png" alt="Party Place" style="height: clamp(160px, 28vw, 320px); width: auto; margin-bottom: -70px; margin-left: 4px;">
    <div class="tagline">Tastemakers</div>
    <div class="title-pill">Creator Preview &nbsp;·&nbsp; June 2026</div>
  </div>

  <!-- SLIDE 1: Your Profile -->
  <div class="slide slide-video" data-index="1">
    <div class="slide-label">Step 1</div>
    <div class="slide-title-text">Set up your profile</div>
    <div class="phone-frame">
      <video src="https://party-place-public-assets.s3.us-east-1.amazonaws.com/tastemakers-demo/ScreenRecording_06-01-2026+19-19-33_1.MP4" autoplay loop muted playsinline></video>
    </div>
    <div class="phone-glow"></div>
  </div>

  <!-- SLIDE 2: Build a List -->
  <div class="slide slide-video" data-index="2">
    <div class="slide-label">Step 2</div>
    <div class="slide-title-text">Build a list</div>
    <div class="phone-frame">
      <video src="https://party-place-public-assets.s3.us-east-1.amazonaws.com/tastemakers-demo/ScreenRecording_06-01-2026+19-48-49_1.MP4" autoplay loop muted playsinline></video>
    </div>
    <div class="phone-glow"></div>
  </div>

  <!-- SLIDE 3: Reorder -->
  <div class="slide slide-video" data-index="3">
    <div class="slide-label">Step 3</div>
    <div class="slide-title-text">Reorder anytime</div>
    <div class="phone-frame">
      <video src="https://party-place-public-assets.s3.us-east-1.amazonaws.com/tastemakers-demo/ScreenRecording_06-01-2026+19-50-39_1.MP4" autoplay loop muted playsinline></video>
    </div>
    <div class="phone-glow"></div>
  </div>

  <!-- SLIDE 4: Share List Link -->
  <div class="slide slide-video" data-index="4">
    <div class="slide-label">Step 4</div>
    <div class="slide-title-text">Share your list</div>
    <div class="phone-frame">
      <video src="https://party-place-public-assets.s3.us-east-1.amazonaws.com/tastemakers-demo/ScreenRecording_06-01-2026+19-52-21_1.MP4" autoplay loop muted playsinline></video>
    </div>
    <div class="phone-glow"></div>
  </div>

  <!-- SLIDE 5: Share Profile Link -->
  <div class="slide slide-video" data-index="5">
    <div class="slide-label">Step 5</div>
    <div class="slide-title-text">Share your profile</div>
    <div class="phone-frame">
      <video src="https://party-place-public-assets.s3.us-east-1.amazonaws.com/tastemakers-demo/ScreenRecording_06-01-2026+19-52-55_1.MP4" autoplay loop muted playsinline></video>
    </div>
    <div class="phone-glow"></div>
  </div>

  <!-- SLIDE 6: Instagram Bio -->
  <div class="slide slide-video" data-index="6">
    <div class="slide-label">Step 6</div>
    <div class="slide-title-text">Drop it in your bio</div>
    <div class="phone-frame">
      <video src="https://party-place-public-assets.s3.us-east-1.amazonaws.com/tastemakers-demo/ScreenRecording_06-01-2026+19-54-08_1.mov" autoplay loop muted playsinline></video>
    </div>
    <div class="phone-glow"></div>
  </div>

</div>

<!-- Progress dots -->
<div class="progress" id="progress"></div>

<!-- Nav hint -->
<div class="nav-hint" id="navHint">click or press → to advance</div>

<!-- Slide counter -->
<div class="slide-counter" id="counter">1 / 7</div>

<script>
  const slides = document.querySelectorAll('.slide');
  const progressEl = document.getElementById('progress');
  const counterEl = document.getElementById('counter');
  const navHint = document.getElementById('navHint');
  const cursor = document.getElementById('cursor');
  let current = 0;
  let hintHidden = false;

  // Build dots
  slides.forEach((_, i) => {
    const dot = document.createElement('div');
    dot.className = 'dot' + (i === 0 ? ' active' : '');
    progressEl.appendChild(dot);
  });

  function goTo(index) {
    if (index < 0 || index >= slides.length) return;

    slides[current].classList.remove('active');
    document.querySelectorAll('.dot')[current].classList.remove('active');

    current = index;

    slides[current].classList.add('active');
    document.querySelectorAll('.dot')[current].classList.add('active');
    counterEl.textContent = (current + 1) + ' / ' + slides.length;

    // Pause all videos, play only current
    document.querySelectorAll('video').forEach(v => { v.pause(); v.currentTime = 0; });
    const activeVideo = slides[current].querySelector('video');
    if (activeVideo) activeVideo.play();

    if (!hintHidden) {
      navHint.classList.add('hidden');
      hintHidden = true;
    }
  }

  function next() { goTo(current + 1); }
  function prev() { goTo(current - 1); }

  // Keyboard
  document.addEventListener('keydown', e => {
    if (e.key === 'ArrowRight' || e.key === ' ') { e.preventDefault(); next(); }
    if (e.key === 'ArrowLeft') { e.preventDefault(); prev(); }
  });

  // Click to advance
  document.addEventListener('click', () => next());

  // Custom cursor
  document.addEventListener('mousemove', e => {
    cursor.style.left = e.clientX + 'px';
    cursor.style.top = e.clientY + 'px';
  });
</script>
</body>
</html>
